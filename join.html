<!DOCTYPE html>
<html>
<head>
  <title>Join MoneshSys</title>
</head>
<body>

  <h2>Join Application</h2>

  <form id="joinForm">
    <input type="text" id="name" placeholder="Enter Your Name" required><br><br>

    <input type="email" id="email" placeholder="Enter Your Email" required><br><br>

    <input type="tel" id="phone" placeholder="Enter Your Phone Number" required><br><br>

    <button type="submit" style="background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer;">
  Submit & Pay ₹50
</button>

  </form>

  <script>
    document.getElementById("joinForm").addEventListener("submit", function(e) {
      e.preventDefault();

      fetch("https://script.google.com/macros/s/AKfycbwHeDttt2Asmo3MyEnfl076a12z0nhREo9XVJGVKwkNETPgU48w8GOcXUE7794J-VHY/exec", {
        method: "POST",
        body: new URLSearchParams({
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
          phone: document.getElementById("phone").value,
          payment: "Pending"
        })
      })
      .then(response => response.text())
      .then(data => {
        window.location.href = "payment.html";
      })
      .catch(error => {
        alert("Error! Check your Apps Script deployment.");
      });
    });
  </script>

</body>
</html>
