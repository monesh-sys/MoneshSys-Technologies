<!DOCTYPE html>
<html lang="en">
<head>

<!-- Google tag -->

<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'AW-18000099705');

<link rel="icon" href="logo.png" type="image/png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MoneshSys Technologies ID Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
background:#0b0f1a;
color:#00e5ff;
font-family:Arial;
text-align:center;
margin:0;
padding:10px;
}

#reader{
width:100%;
max-width:320px;
margin:auto;
}

.card{
margin:20px auto;
padding:15px;
border:1px solid #00e5ff;
border-radius:12px;
background:#111827;
max-width:360px;
}

.error{
color:#ff4d4d;
}

.success{
color:#00ff9c;
}

</style>

</head>

<body>

<h2>🔐 MoneshSys Technologies ID Verification</h2>

<div id="reader"></div>

<div class="card" id="result">
<p>📷 Scan or Upload an ID QR Code</p>
</div>

<div style="margin-top:20px;">
<label>Upload QR Image</label><br>
<input type="file" id="imageUpload" accept="image/*">
</div>

<img id="preview" width="300" style="display:none; border:2px solid #ccc;">

<script>

let scanned=false;

function onScanSuccess(decodedText){

if(scanned) return;

scanned=true;

try{

const data=JSON.parse(decodedText);

if(data.company!=="MoneshSys Technologies"){
document.getElementById("result").innerHTML=
"<p class='error'>❌ Invalid Company ID</p>";
return;
}

document.getElementById("result").innerHTML=`
<h3 class="success">✅ ID Verified</h3>
<p><b>Name:</b> ${data.name}</p>
<p><b>Role:</b> ${data.role}</p>
<p><b>ID:</b> ${data.id}</p>
<p><b>Status:</b> ${data.status}</p>
`;

}

catch(e){

document.getElementById("result").innerHTML=
"<p class='error'>❌ Invalid QR Format</p>";

}

}

const scanner=new Html5QrcodeScanner(
"reader",
{
fps:10,
qrbox:{width:250,height:250},
rememberLastUsedCamera:true
},
false
);

scanner.render(onScanSuccess);


document.getElementById("imageUpload").addEventListener("change",function(e){

scanned=false;

/* reset result automatically */

document.getElementById("result").innerHTML=
"<p>🔍 Scanning uploaded image...</p>";

const file=e.target.files[0];
const preview=document.getElementById("preview");

if(file){
preview.src=URL.createObjectURL(file);
preview.style.display="block";
}

const html5QrCode=new Html5Qrcode("reader");

html5QrCode.scanFile(file,true)
.then(decodedText=>{
onScanSuccess(decodedText);
})
.catch(err=>{
document.getElementById("result").innerHTML=
"<p class='error'>❌ No QR Code found in image</p>";
});

});

</script>

</body>
</html>
