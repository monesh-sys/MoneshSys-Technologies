<meta charset="UTF-8">
<title>Member Verification | MoneshSys Technologies</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  font-family:Arial;
  background:#f2f4f7;
  padding:40px;
}
.box{
  background:#fff;
  max-width:500px;
  margin:auto;
  padding:25px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}
input{
  width:100%;
  padding:10px;
  margin:10px 0;
}
button{
  padding:10px;
  width:100%;
  background:#0a66c2;
  color:white;
  border:none;
  cursor:pointer;
}
.result{
  margin-top:15px;
  padding:15px;
  border-radius:6px;
}
footer{
  text-align: center;
  margin-bottom: 10px;
  margin-top: 100px;
}
.valid{ background:#e6fffa; }
.invalid{ background:#ffe6e6; }
</style>
</head>

<body>

<div class="box">
<h2>🔍 Member Verification</h2>
<p>Enter your MoneshSys Member ID</p>

<input type="text" id="memberId" placeholder="MST-DEV-001">
<button onclick="verifyMember()">Verify</button>

<div id="output"></div>
</div>

<script>
async function verifyMember() {

  const inputId = document
    .getElementById("memberId")
    .value
    .toUpperCase();

  const output = document.getElementById("output");

  output.innerHTML = "Checking member...";

  try {

    const response = await fetch(
      `https://script.google.com/macros/s/AKfycbxqGF4_KvY062BAYx28OJIGGh_6kdGaU-mimJvpkGK65P77zxlDWlGXXhNuaKgO0JKI/exec?id=${inputId}`
    );

    const data = await response.json();

    if (data.found) {

      output.innerHTML = `
        <div class="result valid">
          <strong>✅ Member Verified</strong><br><br>

          <b>Name:</b> ${data.name}<br>
          <b>Role:</b> ${data.role}<br>
          <b>Status:</b> ${data.status}<br>
          <b>Company:</b> MoneshSys Technologies
        </div>
      `;

    } else {

      output.innerHTML = `
        <div class="result invalid">
          ❌ Invalid Member ID<br>
          Please check your ID or contact admin.
        </div>
      `;

    }

  } catch (error) {

    output.innerHTML = `
      <div class="result invalid">
        ❌ Server Error
      </div>
    `;

  }
}
</script>
