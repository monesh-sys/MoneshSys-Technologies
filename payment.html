<!DOCTYPE html>
<html>
<head>
  <title>Payment - MoneshSys</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 25px;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .amount {
      font-size: 22px;
      color: green;
      font-weight: bold;
      margin: 10px 0;
    }

    img {
      width: 200px;
      margin: 15px 0;
    }

    .paid-btn {
      background-color: #007bff;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      width: 100%;
      cursor: pointer;
    }

    .paid-btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Scan & Pay</h2>

    <div class="amount">₹50 Joining Fee</div>

    <!-- UPI QR Code -->
    <img src="https://chart.googleapis.com/chart?cht=qr&chs=200x200&chl=upi://pay?pa=9600829582@fam&pn=MoneshSys&tn=Joining%20Fee&am=500&cu=INR">

    <p>Scan this QR using any UPI app</p>

    <button class="paid-btn" onclick="goThankYou()">I Have Paid</button>
  </div>

  <script>
    function goThankYou() {
      window.location.href = "thankyou.html";
    }
  </script>

</body>
</html>
