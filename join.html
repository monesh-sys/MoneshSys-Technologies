<!DOCTYPE html>
<html>
<head>
  <title>Join MoneshSys</title>

  <!-- Makes website responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 25px;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .blue-btn {
      background-color: #007bff;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }

    .blue-btn:hover {
      background-color: #0056b3;
    }

    h2 {
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Join Application</h2>

    <form id="joinForm">
      <input type="text" id="name" placeholder="Enter Your Name" required>
      <input type="email" id="email" placeholder="Enter Your Email" required>
      <input type="tel" id="phone" placeholder="Enter Your Phone Number" required>

      <button type="submit" class="blue-btn">
        Submit & Pay ₹500
      </button>
    </form>
  </div>

  <script>
    document.getElementById("joinForm").addEventListener("submit", function(e) {
      e.preventDefault();

      fetch("https://script.google.com/macros/s/AKfycbwHeDttt2Asmo3MyEnfl076a12z0nhREo9XVJGVKwkNETPgU48w8GOcXUE7794J-VHY/exec", {
        method: "POST",
        body: new URLSearchParams({
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
          phone: document.getElementById("phone").value,
          payment: "Pending"
        })
      })
      .then(response => response.text())
      .then(data => {
        window.location.href = "payment.html";
      })
      .catch(error => {
        alert("Error! Check your Apps Script deployment.");
      });
    });
  </script>

</body>
</html>
