<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MoneshSys Technologies Ad</title>

<style>
body{
margin:0;
background:black;
overflow:hidden;
font-family:Arial;
}

video{
width:100%;
height:100vh;
object-fit:cover;
}

#skip{
position:absolute;
top:20px;
right:20px;
background:red;
color:white;
border:none;
padding:12px 20px;
font-size:16px;
cursor:pointer;
display:none;
border-radius:5px;
}
</style>

</head>

<body>

<video id="adVideo" autoplay muted>
<source src="advideo.mp4" type="video/mp4">
</video>

<button id="skip" onclick="skipAd()">Skip Ad</button>

<script>

// Show skip button after 5 seconds
setTimeout(function(){
document.getElementById("skip").style.display="block";
},5000);

// Skip button function
function skipAd(){
window.location.href="home.html";
}

// When video ends go to website
document.getElementById("adVideo").onended=function(){
window.location.href=index.html";
};

</script>

</body>
</html>
