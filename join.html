<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Join MoneshSys</title>
    <link rel="icon" href="logo.png" type="image/png">
    <style>
        body { margin:0; font-family: Arial, sans-serif; background:#f4f6f8; color:#333; }
        section { max-width:800px; margin:30px auto; padding:40px 20px; background:white; border-radius:8px; }
        h2 { color:#0a66c2; }
        input, select, textarea, button { width:100%; padding:10px; margin:8px 0; border-radius:4px; border:1px solid #ccc; box-sizing:border-box; }
        button { background-color:#0a66c2; color:white; border:none; cursor:pointer; }
        button:hover { background-color:#084e96; }
    </style>
</head>
<body>

<section id="join">
    <h2>Join Our Team</h2>
    <p>We welcome students and developers who want to learn, collaborate, and grow together.</p>

    <form id="join-form">
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="text" name="mobile" placeholder="Mobile Number" required>
        <select name="class" required>
            <option value="">Select Your Class</option>
            <option value="10th">10th</option>
            <option value="11th">11th</option>
            <option value="12th">12th</option>
            <option value="College">College</option>
        </select>
        <textarea name="message" placeholder="Any Message (Optional)"></textarea>

        <button type="submit">Submit Form & Go to Payment</button>
    </form>
</section>

<script>
document.getElementById('join-form').addEventListener('submit', function(e){
    e.preventDefault();

    const formData = new FormData(this);
    const data = new URLSearchParams(formData);

    // 🔹 Replace with your deployed Web App URL
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbwNUHOHw-o_9QV-rGX7IzPLe_ljhTzYStqOjNUNn0wNdpa3Ik3zC-FxE25xNSYTkWRj/exec";

    // Use no-cors to avoid fetch error in FAMAPP
    fetch(GOOGLE_SHEET_URL, {
        method: "POST",
        body: data,
        mode: "no-cors"
    })
    .then(() => {
        // Save user info to display on thankyou page
        localStorage.setItem("memberName", this.name.value);
        localStorage.setItem("memberEmail", this.email.value);
        localStorage.setItem("memberMobile", this.mobile.value);

        // Redirect to payment page
        window.location.href = "payment.html";
    })
    .catch(err => {
        alert("Error submitting form. Please try again!");
        console.error(err);
    });
});
</script>

</body>
</html>
