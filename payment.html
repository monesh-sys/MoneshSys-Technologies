<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Payment Page</title>
    <style>
        body { font-family: Arial; text-align:center; padding:50px; background:#f4f6f8; }
        .qr { margin: 20px 0; }
        button { display:none; padding: 12px 20px; background:#0a66c2; color:white; border:none; border-radius:5px; cursor:pointer; font-size:16px; }
        button:hover { background:#084e96; }
    </style>
</head>
<body>

    <h1>Complete Your Payment</h1>
    <p>Scan this QR code to pay your joining fee:</p>
    <div class="qr">
        <img src="qr.png" alt="QR Code" width="200">
    </div>

    <p>After completing payment, click the button below:</p>
    <button id="paid-btn">I Have Paid</button>

    <script>
        // Show the "I Have Paid" button only after user clicks on QR or confirms
        // Simple demo: show button after 3 seconds (simulate payment completed)
        setTimeout(() => {
            document.getElementById('paid-btn').style.display = 'inline-block';
        }, 3000); // You can adjust or trigger via your app logic

        // Redirect to thank you page after payment confirmation
        document.getElementById('paid-btn').addEventListener('click', () => {
            window.location.href = "thankyou.html";
        });
    </script>

</body>
</html>
