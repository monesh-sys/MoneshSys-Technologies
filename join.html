<!DOCTYPE html>
<html>
<head>
  <title>Join Form</title>
</head>
<body>

<h2>Join Application</h2>

<input type="text" id="name" placeholder="Enter Name"><br><br>
<input type="email" id="email" placeholder="Enter Email"><br><br>

<!-- 🔥 PHONE NUMBER ADDED -->
<input type="text" id="phone" placeholder="Enter Phone Number"><br><br>

<button onclick="sendEmail()">Submit</button>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<script>
  emailjs.init("LANmw1j3MljFboz_x"); // 🔴 replace this

  function sendEmail() {
    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let phone = document.getElementById("phone").value;

    if (!name || !email || !phone) {
      alert("Please fill all fields");
      return;
    }

    emailjs.send("service_o3mg6db", "template_1fsfsso", {
      to_name: name,
      to_email: email,
      phone_number: phone   // 🔥 NEW FIELD SENT
    })
    .then(function(response) {
      console.log("SUCCESS!", response.status, response.text);

      window.location.href = "join-success.html";
    })
    .catch(function(error) {
      console.log("FAILED...", error);
      alert("Email failed! Check console (F12)");
    });
  }
</script>

</body>
</html>
